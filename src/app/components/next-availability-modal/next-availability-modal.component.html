<div class="tu-modal">
  <div class="tu-modal-header">
    <h2 class="tu-modal-title"><i class="fas fa-calendar-week me-2"></i>2 weeks availability</h2>
    <button type="button" class="tu-modal-close" aria-label="Close" (click)="closeModal()">
      <i class="fas fa-xmark"></i>
    </button>
  </div>

  <div class="tu-modal-train">
    <app-train-card [showNextAvail]="false" [train]="train" [doj]="doj"></app-train-card>
  </div>

  <div class="tu-modal-body">
    <ul class="tu-class-tabs">
      @for (cls of train.availableClasses; track cls) {
        <li>
          <a class="tu-class-tab" [class.active]="cls === selectedClass"
          (click)="updateSelectedClass(cls)" (keyup.enter)="updateSelectedClass(cls)" (keyup.space)="updateSelectedClass(cls)"
          role="tab" tabindex="0" [attr.aria-selected]="cls === selectedClass">{{cls}}</a>
        </li>
      }
    </ul>

    <div class="tu-modal-avail">
      <div class="tu-modal-avail-grid">
        @for (avail of availList; track avail) {
          <div class="tu-modal-avail-item">
            <p class="tu-avail-date">{{helper.formatDateString(avail.availablityDate)}}</p>
            <app-availability-card [avail]="avail" [train]="train"
            [doj]="helper.convertDateToString(avail.availablityDate)" [updateStatus]="true"></app-availability-card>
          </div>
        }
      </div>

      @if (loading) {
        <div class="tu-modal-loading">
          <span class="tu-modal-spinner"></span>
        </div>
      }

      @if (!loading) {
        <button class="tu-load-more" [attr.aria-label]="'Load Next 6 Days Availability'"
          (click)="loadNextAvail()">
          <i class="fas fa-plus"></i> Load more days
        </button>
      }
    </div>
  </div>
</div>
