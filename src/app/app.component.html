<div class="tu-shell">
  <app-header></app-header>
  <main class="tu-main"><router-outlet></router-outlet></main>
  <app-footer></app-footer>
</div>

<!-- Toast stack -->
<div class="tu-toast-stack">
  @if (showAppReadyMessage) {
    <div class="tu-toast tu-toast-success" role="alert">
      <span class="tu-toast-icon"><i class="fas fa-circle-check"></i></span>
      <div class="tu-toast-body">
        <strong>All set!</strong>
        <span>The application is ready.</span>
      </div>
    </div>
  }

  @if (failed) {
    <div class="tu-toast tu-toast-error" role="alert">
      <span class="tu-toast-icon"><i class="fas fa-triangle-exclamation"></i></span>
      <div class="tu-toast-body">
        <strong>Something went wrong</strong>
        <span>Please try again later.</span>
      </div>
      <button type="button" class="tu-toast-close" (click)="failed = false" aria-label="Close"><i class="fas fa-xmark"></i></button>
    </div>
  }

  @if (apiLoading) {
    <div class="tu-toast tu-toast-loading" role="alert" aria-live="assertive">
      <span class="tu-toast-spinner"></span>
      <div class="tu-toast-body">
        <strong>Booting up…</strong>
        <span>Preparing the application for you.</span>
      </div>
    </div>
  }
</div>
