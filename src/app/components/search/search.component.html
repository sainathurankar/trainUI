<section class="tu-search">
  <form class="tu-search-form">
    <div class="tu-fields">
      <!-- FROM -->
      <div class="tu-field position-relative">
        <label class="tu-field-label"><i class="fas fa-circle-dot text-primary"></i> From</label>
        <input type="text" id="from" name="from" class="form-control tu-input"
          placeholder="Enter source station"
          [(ngModel)]="frominputValue" (keyup)="onInput('from')" autocomplete="off">
        <ul class="tu-suggestions" [class.show]="fromsuggestions.length > 0">
          <li class="tu-suggestion" *ngFor="let suggestion of fromsuggestions"
            (click)="onSelectSuggestion(suggestion, 'from')">
            <i class="fas fa-train-subway text-muted"></i>
            <span>{{ suggestion.stationName }} <b>({{suggestion.stationCode}})</b></span>
          </li>
        </ul>
      </div>

      <!-- SWAP -->
      <div class="tu-swap-col">
        <button type="button" (click)="switchStations()"
          [disabled]="frominputValue === '' || toinputValue === ''"
          class="tu-swap-btn" title="Swap stations" aria-label="Swap source and destination">
          <i class="fas fa-arrow-right-arrow-left"></i>
        </button>
      </div>

      <!-- TO -->
      <div class="tu-field position-relative">
        <label class="tu-field-label"><i class="fas fa-location-dot text-danger"></i> To</label>
        <input type="text" id="to" name="to" class="form-control tu-input"
          placeholder="Enter destination station"
          [(ngModel)]="toinputValue" (keyup)="onInput('to')" autocomplete="off">
        <ul class="tu-suggestions" [class.show]="tosuggestions.length > 0">
          <li class="tu-suggestion" *ngFor="let suggestion of tosuggestions"
            (click)="onSelectSuggestion(suggestion, 'to')">
            <i class="fas fa-train-subway text-muted"></i>
            <span>{{ suggestion.stationName }} <b>({{suggestion.stationCode}})</b></span>
          </li>
        </ul>
      </div>

      <!-- DATE -->
      <div class="tu-field">
        <label class="tu-field-label"><i class="fas fa-calendar-day text-warning"></i> Date of journey</label>
        <input class="form-control tu-input" type="date" [(ngModel)]="dateOfTravel"
          name="date" id="date" #date [min]="minDate">
      </div>

      <!-- SEARCH -->
      <div class="tu-search-col">
        <button type="submit" (click)="onClickSearch()"
          [disabled]="frominputValue === '' || toinputValue === '' || dateOfTravel === ''"
          class="btn btn-gradient tu-search-btn">
          <i class="fas fa-magnifying-glass"></i>
          <span>Search trains</span>
        </button>
      </div>
    </div>
  </form>
</section>
