<div class="tu-quota" [ngClass]="getQuotaCardClass(avail?.status)">
  <span *ngIf="avail?.quota === 'TQ' && (avail.status === 'Available' || avail.status === 'CURR_AVBL' || avail.status === 'RAC')"
    class="tu-ribbon tu-ribbon-tatkal">TATKAL</span>
  <span *ngIf="avail?.tg" class="tu-ribbon tu-ribbon-guarantee">GUARANTEE</span>

  <div class="tu-quota-body" (click)="navigateToBooking()" [title]="'Click to book'">
    <div class="tu-quota-top">
      <span class="tu-quota-type">{{ avail?.quota }}</span>
      <span *ngIf="avail?.className" class="tu-quota-class">{{ avail?.className }}</span>
    </div>

    <div class="tu-quota-status" [ngClass]="getAvailabilityClass(avail?.status)">
      <span class="tu-seats">{{ avail?.seats }}</span>
      <span class="tu-status-label">{{ avail?.status }}</span>
    </div>

    <div class="tu-quota-foot">
      <span *ngIf="avail?.fare !== 'null'" class="tu-fare">₹ {{ avail?.fare }}</span>
      <span *ngIf="!updating" class="tu-refresh" [title]="'Click to refresh'"
        (click)="$event.stopPropagation(); update()">
        <i class="fas fa-arrows-rotate"></i>
      </span>
      <span *ngIf="updating" class="tu-refresh-spinner"></span>
    </div>

    <span class="tu-updated" *ngIf="avail?.lastUpdatedOn">{{ avail?.lastUpdatedOn }}</span>
  </div>
</div>
